<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#BFE3F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apartman Kulesi">
<meta name="description" content="Kat kat apartman diz, kuleyi devirmeden en yükseğe çık.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Apartman Kulesi</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #F7F3E8;
  }
  body {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!--
  Classic scripts (not ES modules) so the game also runs when index.html is
  opened directly from disk (file://). They share one global scope; order matters.
-->
<script src="src/config.js"></script>
<script src="src/utils.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/crane.js"></script>
<script src="src/tower.js"></script>
<script src="src/city.js"></script>
<script src="src/share.js"></script>
<script src="src/main.js"></script>
<script>
  // PWA: offline support. Service workers need http(s); skipped when opened from disk (file://).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
